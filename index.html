<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSJ-Cal — Daglig ernæringslogg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1e22;
    --panel-2: #22252b;
    --line: #33363d;
    --text: #ede9e2;
    --text-dim: #9b9a95;
    --amber: #e8a33d;
    --green: #6fcf97;
    --red: #e0674f;
    --carb: #7fb8d9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top, #1a1c21 0%, #0f1013 100%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 720px; margin: 0 auto;}
  .header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 8px;}
  .brand{font-family:'Rajdhani', sans-serif; font-weight:700; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase;}
  .brand span{color: var(--amber);}
  .sub{font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase;}
  #userBadge{font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:10px;}
  #logoutBtn{background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 12px; border-radius:4px; font-size:12px; cursor:pointer; font-family:'Inter';}
  #logoutBtn:hover{border-color:var(--amber); color:var(--amber);}
  .authCard{background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 32px 28px; max-width: 380px; margin: 10vh auto;}
  .authCard h1{font-family:'Rajdhani'; font-size: 22px; letter-spacing:0.03em; margin-bottom: 4px; text-transform: uppercase;}
  .authCard p{color: var(--text-dim); font-size: 13px; margin-bottom: 22px;}
  .field{margin-bottom: 14px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:6px;}
  .field input{width:100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 5px; font-size: 14px; font-family:'Inter';}
  .field input:focus{outline:none; border-color: var(--amber);}
  .btnRow{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding: 11px; border-radius: 5px; border: none; font-weight:600; font-size: 13px; cursor: pointer; font-family:'Inter'; letter-spacing:0.02em;}
  .btn-primary{background: var(--amber); color: #14161a;}
  .btn-primary:hover{background:#f0b258;}
  .btn-ghost{background: transparent; border:1px solid var(--line); color: var(--text-dim);}
  .btn-ghost:hover{border-color:var(--text-dim); color:var(--text);}
  .authMsg{font-size:12px; color: var(--red); margin-top:10px; min-height:14px;}
  .authNote{font-size:11px; color:var(--text-dim); margin-top:14px; line-height:1.5;}
  .authNote a{color:var(--amber);}
  .tabs{display:flex; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--line);}
  .tab{padding: 10px 4px; margin-right: 18px; font-size:13px; color: var(--text-dim); cursor:pointer; border-bottom: 2px solid transparent; text-transform:uppercase; letter-spacing:0.05em; font-family:'Rajdhani'; font-weight:600;}
  .tab.active{color: var(--amber); border-bottom-color: var(--amber);}
  .view{display:none;}
  .view.active{display:block;}
  .cluster{background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 16px 10px; display:flex; justify-content: space-around; flex-wrap: wrap; gap: 16px; margin-bottom: 18px;}
  .gauge{display:flex; flex-direction:column; align-items:center; width: 150px;}
  .gauge svg{display:block;}
  .gauge-label{font-family:'Rajdhani'; font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color: var(--text-dim); margin-top: 4px;}
  .gauge-remaining{font-family:'JetBrains Mono'; font-size: 22px; font-weight:700; fill: var(--text);}
  .gauge-unit{font-family:'Inter'; font-size:10px; fill: var(--text-dim);}
  .gauge-of{font-family:'JetBrains Mono'; font-size:11px; color: var(--text-dim); margin-top:2px;}
  .statRow{display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px;}
  .statBox{background: var(--panel-2); border:1px solid var(--line); border-radius:8px; padding: 12px 14px;}
  .statBox .n{font-family:'JetBrains Mono'; font-size:18px; font-weight:700;}
  .statBox .l{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .card{background: var(--panel); border:1px solid var(--line); border-radius:10px; padding: 18px; margin-bottom: 18px;}
  .card h2{font-family:'Rajdhani'; font-size:16px; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px; color: var(--text);}
  .grid4{display:grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap:8px;}
  .grid4 .field{margin-bottom:0;}
  .extraToggle{font-size:12px; color:var(--amber); cursor:pointer; margin:10px 0 0; display:inline-block;}
  .extraGrid{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .addBtn{margin-top: 14px; background: var(--amber); color:#14161a; border:none; padding:10px 18px; border-radius:5px; font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter';}
  .addBtn:hover{background:#f0b258;}
  .addBtn:disabled{opacity:0.5; cursor:not-allowed;}
  .logItem{display:flex; justify-content:space-between; align-items:center; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 13px;}
  .logItem:last-child{border-bottom:none;}
  .logItem .name{font-weight:500;}
  .logItem .macros{color: var(--text-dim); font-family:'JetBrains Mono'; font-size:12px;}
  .logItem .del{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; line-height:1;}
  .logItem .del:hover{color: var(--red);}
  .empty{color:var(--text-dim); font-size:13px; padding: 10px 0;}
  .calHeader{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .calHeader button{background:none; border:1px solid var(--line); color:var(--text); padding:6px 12px; border-radius:5px; cursor:pointer;}
  .calTitle{font-family:'Rajdhani'; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;}
  .calGrid{display:grid; grid-template-columns: repeat(7, 1fr); gap:6px;}
  .calDow{text-align:center; font-size:10px; color:var(--text-dim); text-transform:uppercase; padding-bottom:4px;}
  .calCell{aspect-ratio: 1; border-radius:6px; background: var(--panel-2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-family:'JetBrains Mono'; font-size:12px; position:relative;}
  .calCell.empty-cell{background:transparent; border:none; cursor:default;}
  .calCell:hover{border-color: var(--amber);}
  .calCell.hasData::after{content:''; width:5px; height:5px; border-radius:50%; background: var(--green); position:absolute; bottom:5px;}
  .calCell.today{border-color: var(--amber); color: var(--amber);}
  .dayDetail{margin-top:16px; background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .dayDetail h3{font-family:'Rajdhani'; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;}
  .goalsGrid{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;}
  .saveMsg{font-size:12px; color: var(--green); margin-top:10px; min-height:14px;}
  .loadingScreen{text-align:center; color:var(--text-dim); font-size:13px; margin-top:20vh;}
  @media (max-width: 600px){
    body{padding: 14px 10px 50px;}
    .authCard{margin: 6vh auto; padding: 26px 20px; max-width: 100%;}
    .header{gap: 4px;}
    .brand{font-size: 21px;}
    .sub{font-size: 10.5px;}
    #userBadge{font-size:11px; width:100%; justify-content:space-between;}
    .tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-bottom:16px;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{margin-right:14px; font-size:12px; white-space:nowrap; padding-bottom:8px;}
    .cluster{padding: 16px 4px 4px; gap: 4px; justify-content:space-between;}
    .gauge{width: 31%; min-width:0;}
    .gauge svg{width:100%; height:auto;}
    .gauge-remaining{font-size:18px;}
    .gauge-label{font-size:10.5px; margin-top:2px;}
    .gauge-of{font-size:9.5px;}
    .statRow{gap:6px; margin-bottom:16px;}
    .statBox{padding:9px 8px;}
    .statBox .n{font-size:15px;}
    .statBox .l{font-size:9.5px;}
    .card{padding:14px;}
    .card h2{font-size:14px; margin-bottom:10px;}
    .grid4{grid-template-columns: 1fr 1fr; gap:8px;}
    .grid4 .field:first-child{grid-column: 1 / -1;}
    .extraGrid{grid-template-columns: 1fr 1fr;}
    .field input{padding: 9px 10px; font-size:16px;}
    .addBtn{width:100%;}
    .logItem{font-size:12.5px;}
    .logItem .macros{font-size:11px;}
    .goalsGrid{grid-template-columns:1fr; gap:8px;}
    .calGrid{gap:4px;}
    .calCell{font-size:11px; border-radius:5px;}
    .calDow{font-size:9px;}
    .calHeader button{padding:5px 10px;}
    .dayDetail{padding:14px;}
    .btnRow{flex-direction:column;}
  }
  @media (max-width: 360px){
    .gauge-remaining{font-size:15px;}
    .gauge-label{font-size:9.5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loadingScreen" class="loadingScreen">Kobler til...</div>

  <div id="authScreen" class="authCard" style="display:none;">
    <h1>TSJ-Cal</h1>
    <p>Logg inn for å registrere dagens forbruk.</p>
    <div class="field">
      <label>E-post</label>
      <input id="authEmail" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label>Passord</label>
      <input id="authPass" type="password" autocomplete="current-password">
    </div>
    <div class="btnRow">
      <button class="btn btn-primary" id="loginBtn">Logg inn</button>
      <button class="btn btn-ghost" id="registerBtn">Opprett bruker</button>
    </div>
    <div class="authMsg" id="authMsg"></div>
    <div class="authNote">Passord må være minst 6 tegn. Alle kan opprette sin egen konto — dataene lagres separat per bruker i Firebase.</div>
  </div>

  <div id="app" style="display:none;">
    <div class="header">
      <div>
        <div class="brand">TSJ-<span>Cal</span></div>
        <div class="sub" id="dateLabel">—</div>
      </div>
      <div id="userBadge"></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="today">I dag</div>
      <div class="tab" data-tab="calendar">Kalender</div>
      <div class="tab" data-tab="goals">Mål</div>
    </div>

    <div class="view active" id="view-today">
      <div class="cluster" id="gaugeCluster"></div>
      <div class="statRow" id="statRow"></div>
      <div class="card">
        <h2>Registrer måltid</h2>
        <div class="grid4">
          <div class="field"><label>Navn</label><input id="fName" type="text" placeholder="F.eks. Kyllingsalat"></div>
          <div class="field"><label>Kcal</label><input id="fCal" type="number" min="0"></div>
          <div class="field"><label>Protein g</label><input id="fProt" type="number" min="0"></div>
          <div class="field"><label>Karbo g</label><input id="fCarb" type="number" min="0"></div>
        </div>
        <span class="extraToggle" id="extraToggle">+ Fett, fiber, sukker</span>
        <div class="extraGrid" id="extraGrid" style="display:none;">
          <div class="field"><label>Fett g</label><input id="fFat" type="number" min="0"></div>
          <div class="field"><label>Fiber g</label><input id="fFiber" type="number" min="0"></div>
          <div class="field"><label>Sukker g</label><input id="fSugar" type="number" min="0"></div>
        </div>
        <button class="addBtn" id="addEntryBtn">Legg til</button>
      </div>
      <div class="card">
        <h2>Dagens logg</h2>
        <div id="logList"></div>
      </div>
    </div>

    <div class="view" id="view-calendar">
      <div class="card">
        <div class="calHeader">
          <button id="prevMonth">‹</button>
          <div class="calTitle" id="calMonthLabel">—</div>
          <button id="nextMonth">›</button>
        </div>
        <div class="calGrid" id="calGrid"></div>
      </div>
      <div class="dayDetail" id="dayDetail" style="display:none;"></div>
    </div>

    <div class="view" id="view-goals">
      <div class="card">
        <h2>Daglige mål</h2>
        <div class="goalsGrid">
          <div class="field"><label>Kalorier (kcal)</label><input id="gCal" type="number" min="0"></div>
          <div class="field"><label>Protein (g)</label><input id="gProt" type="number" min="0"></div>
          <div class="field"><label>Karbohydrater (g)</label><input id="gCarb" type="number" min="0"></div>
        </div>
        <button class="addBtn" id="saveGoalsBtn">Lagre mål</button>
        <div class="saveMsg" id="goalsMsg"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ======================================================================
// BYTT UT MED DITT EGET FIREBASE-PROSJEKT (Firebase Console -> Project settings -> SDK setup and configuration)
// ======================================================================
const firebaseConfig = {
  apiKey: "AIzaSyD4rmteTHELgUHjMwnE1O5r-_x-BO45OCc",
  authDomain: "tsj-cal.firebaseapp.com",
  projectId: "tsj-cal",
  storageBucket: "tsj-cal.firebasestorage.app",
  messagingSenderId: "1059035966632",
  appId: "1:1059035966632:web:edb0fcf1e1438eb462669d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null; // Firebase user object
let goals = { calories: 2200, protein: 150, carbs: 250 };
let calState = { year: null, month: null };

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateLabel(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('no-NO', { weekday:'long', day:'numeric', month:'long' });
}
function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function sumEntries(entries, key){
  return entries.reduce((s, e) => s + (Number(e[key]) || 0), 0);
}

// ---------- FIRESTORE HELPERS ----------
async function getUserDoc(){
  const snap = await getDoc(doc(db, 'users', currentUser.uid));
  return snap.exists() ? snap.data() : null;
}
async function saveUserGoals(newGoals){
  await setDoc(doc(db, 'users', currentUser.uid), { goals: newGoals }, { merge: true });
}
async function getDayLog(dateISO){
  const snap = await getDoc(doc(db, 'users', currentUser.uid, 'logs', dateISO));
  return snap.exists() ? snap.data() : { entries: [] };
}
async function saveDayLog(dateISO, log){
  await setDoc(doc(db, 'users', currentUser.uid, 'logs', dateISO), log);
}

// ---------- AUTH ----------
setPersistence(auth, browserLocalPersistence).catch(() => {});

document.getElementById('registerBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  msg.style.color = 'var(--red)';
  if(!email || !pass){ msg.textContent = 'Fyll ut e-post og passord.'; return; }
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), {
      goals: { calories: 2200, protein: 150, carbs: 250 }
    });
    msg.style.color = 'var(--green)';
    msg.textContent = 'Bruker opprettet! Du blir logget inn automatisk.';
  } catch(e){
    msg.textContent = oversettFeil(e.code);
  }
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  msg.style.color = 'var(--red)';
  if(!email || !pass){ msg.textContent = 'Fyll ut e-post og passord.'; return; }
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    msg.textContent = oversettFeil(e.code);
  }
});

function oversettFeil(code){
  const map = {
    'auth/email-already-in-use': 'Denne e-posten er allerede registrert.',
    'auth/invalid-email': 'Ugyldig e-postadresse.',
    'auth/weak-password': 'Passordet må være minst 6 tegn.',
    'auth/user-not-found': 'Fant ingen bruker med denne e-posten.',
    'auth/wrong-password': 'Feil passord.',
    'auth/invalid-credential': 'Feil e-post eller passord.',
    'auth/too-many-requests': 'For mange forsøk. Prøv igjen senere.'
  };
  return map[code] || ('Noe gikk galt: ' + code);
}

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loadingScreen').style.display = 'none';
  if(user){
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userBadge').innerHTML = escapeHTML(user.email) + ' <button id="logoutBtn">Logg ut</button>';
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
    await enterApp();
  } else {
    currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'block';
  }
});

async function enterApp(){
  const rec = await getUserDoc();
  if(rec && rec.goals) goals = rec.goals;
  document.getElementById('gCal').value = goals.calories;
  document.getElementById('gProt').value = goals.protein;
  document.getElementById('gCarb').value = goals.carbs;

  document.getElementById('dateLabel').textContent = fmtDateLabel(todayISO());
  await renderToday();

  const now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth();
  await renderCalendar();
}

// ---------- TABS ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
  });
});

document.getElementById('extraToggle').addEventListener('click', () => {
  const g = document.getElementById('extraGrid');
  const showing = g.style.display !== 'none';
  g.style.display = showing ? 'none' : 'grid';
  document.getElementById('extraToggle').textContent = showing ? '+ Fett, fiber, sukker' : '– Skjul ekstra felt';
});

// ---------- GAUGES ----------
function gaugeSVG(label, consumed, goal, unit, color){
  const remaining = Math.max(goal - consumed, 0);
  const over = consumed > goal;
  const frac = Math.min(consumed / (goal || 1), 1);
  const r = 52, cx = 65, cy = 65;
  const describeArc = (fraction) => {
    const angle = 180 - fraction * 180;
    const rad = (angle * Math.PI) / 180;
    const x = cx + r * Math.cos(rad);
    const y = cy - r * Math.sin(rad);
    const largeArc = fraction > 0.5 ? 1 : 0;
    return `M ${cx - r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${x} ${y}`;
  };
  const bgArc = `M ${cx - r} ${cy} A ${r} ${r} 0 1 1 ${cx + r} ${cy}`;
  const fillArc = frac > 0 ? describeArc(frac) : '';
  const arcColor = over ? 'var(--red)' : color;
  return `
    <svg width="130" height="80" viewBox="0 0 130 80">
      <path d="${bgArc}" fill="none" stroke="#33363d" stroke-width="10" stroke-linecap="round"/>
      ${fillArc ? `<path d="${fillArc}" fill="none" stroke="${arcColor}" stroke-width="10" stroke-linecap="round"/>` : ''}
      <text x="65" y="58" text-anchor="middle" class="gauge-remaining">${remaining}</text>
      <text x="65" y="72" text-anchor="middle" class="gauge-unit">${unit} igjen</text>
    </svg>
    <div class="gauge-label">${label}</div>
    <div class="gauge-of">${consumed} / ${goal} ${unit}</div>
  `;
}

async function renderToday(){
  const date = todayISO();
  const log = await getDayLog(date);
  const entries = log.entries || [];

  const cal = sumEntries(entries, 'cal');
  const prot = sumEntries(entries, 'prot');
  const carb = sumEntries(entries, 'carb');
  const fat = sumEntries(entries, 'fat');
  const fiber = sumEntries(entries, 'fiber');
  const sugar = sumEntries(entries, 'sugar');

  document.getElementById('gaugeCluster').innerHTML = `
    <div class="gauge">${gaugeSVG('Kalorier', cal, goals.calories, 'kcal', 'var(--amber)')}</div>
    <div class="gauge">${gaugeSVG('Protein', prot, goals.protein, 'g', 'var(--green)')}</div>
    <div class="gauge">${gaugeSVG('Karbo', carb, goals.carbs, 'g', 'var(--carb)')}</div>
  `;

  document.getElementById('statRow').innerHTML = `
    <div class="statBox"><div class="n">${fat}g</div><div class="l">Fett</div></div>
    <div class="statBox"><div class="n">${fiber}g</div><div class="l">Fiber</div></div>
    <div class="statBox"><div class="n">${sugar}g</div><div class="l">Sukker</div></div>
  `;

  const listEl = document.getElementById('logList');
  if(entries.length === 0){
    listEl.innerHTML = '<div class="empty">Ingenting registrert ennå i dag.</div>';
  } else {
    listEl.innerHTML = entries.map(e => `
      <div class="logItem">
        <div>
          <div class="name">${escapeHTML(e.name)}</div>
          <div class="macros">${e.cal} kcal · P ${e.prot}g · K ${e.carb}g${e.fat ? ' · F ' + e.fat + 'g' : ''}</div>
        </div>
        <button class="del" data-id="${e.id}">✕</button>
      </div>
    `).join('');
    listEl.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const log2 = await getDayLog(date);
        log2.entries = (log2.entries || []).filter(en => en.id !== btn.dataset.id);
        await saveDayLog(date, log2);
        await renderToday();
      });
    });
  }
}

document.getElementById('addEntryBtn').addEventListener('click', async () => {
  const btn = document.getElementById('addEntryBtn');
  const name = document.getElementById('fName').value.trim();
  if(!name){ document.getElementById('fName').focus(); return; }
  btn.disabled = true;

  const cal = Number(document.getElementById('fCal').value) || 0;
  const prot = Number(document.getElementById('fProt').value) || 0;
  const carb = Number(document.getElementById('fCarb').value) || 0;
  const fat = Number(document.getElementById('fFat').value) || 0;
  const fiber = Number(document.getElementById('fFiber').value) || 0;
  const sugar = Number(document.getElementById('fSugar').value) || 0;

  const date = todayISO();
  const log = await getDayLog(date);
  log.entries = log.entries || [];
  log.entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, cal, prot, carb, fat, fiber, sugar
  });
  await saveDayLog(date, log);

  ['fName','fCal','fProt','fCarb','fFat','fFiber','fSugar'].forEach(id => document.getElementById(id).value = '');
  btn.disabled = false;
  await renderToday();
});

// ---------- CALENDAR ----------
const MONTH_NAMES = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
const DOW = ['Ma','Ti','On','To','Fr','Lø','Sø'];

document.getElementById('prevMonth').addEventListener('click', async () => {
  calState.month--;
  if(calState.month < 0){ calState.month = 11; calState.year--; }
  await renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', async () => {
  calState.month++;
  if(calState.month > 11){ calState.month = 0; calState.year++; }
  await renderCalendar();
});

async function renderCalendar(){
  const { year, month } = calState;
  document.getElementById('calMonthLabel').textContent = MONTH_NAMES[month] + ' ' + year;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = DOW.map(d => `<div class="calDow">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayISO();

  for(let i = 0; i < startOffset; i++){
    grid.innerHTML += '<div class="calCell empty-cell"></div>';
  }

  for(let day = 1; day <= daysInMonth; day++){
    const iso = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const log = await getDayLog(iso);
    const hasData = log.entries && log.entries.length > 0;
    const isToday = iso === today;
    const cell = document.createElement('div');
    cell.className = 'calCell' + (hasData ? ' hasData' : '') + (isToday ? ' today' : '');
    cell.textContent = day;
    cell.addEventListener('click', () => showDayDetail(iso));
    grid.appendChild(cell);
  }
}

async function showDayDetail(iso){
  const log = await getDayLog(iso);
  const entries = log.entries || [];
  const cal = sumEntries(entries, 'cal');
  const prot = sumEntries(entries, 'prot');
  const carb = sumEntries(entries, 'carb');

  const detail = document.getElementById('dayDetail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <h3>${fmtDateLabel(iso)}</h3>
    <div class="statRow">
      <div class="statBox"><div class="n">${cal}</div><div class="l">Kcal</div></div>
      <div class="statBox"><div class="n">${prot}g</div><div class="l">Protein</div></div>
      <div class="statBox"><div class="n">${carb}g</div><div class="l">Karbo</div></div>
    </div>
    ${entries.length === 0
      ? '<div class="empty">Ingen registreringer denne dagen.</div>'
      : entries.map(e => `
        <div class="logItem">
          <div>
            <div class="name">${escapeHTML(e.name)}</div>
            <div class="macros">${e.cal} kcal · P ${e.prot}g · K ${e.carb}g</div>
          </div>
        </div>
      `).join('')
    }
  `;
}
